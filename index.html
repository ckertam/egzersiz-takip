<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Egzersiz Takip</title>
    <meta name="description" content="Haftada 5 gün antrenman, yüzme ve sauna ile kilo verme ve yağ yakma takip uygulaması" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
    <meta name="theme-color" content="#0f172a" />
  </head>
  <body>
    <div class="shell">
      <header class="app-header">
        <h1>💪 Egzersiz Takip</h1>
        <p class="subtitle">85 kg → 70 kg · Kilo verme &amp; yağ yakma</p>
      </header>

      <section class="card" id="progressCard">
        <div class="progress-head">
          <span id="progressStartLabel">85 kg</span>
          <span id="progressGoalLabel">Hedef: 70 kg</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-meta">
          <span id="progressCurrentLabel">Güncel: 85 kg</span>
          <span id="progressRemainingLabel">Kalan: 15 kg</span>
        </div>
      </section>

      <nav class="tabs" id="tabs">
        <button class="tab-btn active" data-tab="plan">Plan</button>
        <button class="tab-btn" data-tab="log">Günlük</button>
        <button class="tab-btn" data-tab="weight">Kilo</button>
      </nav>

      <section class="tab-panel" id="panel-plan">
        <div class="card">
          <h2>Haftalık Plan</h2>
          <p class="hint">Koşu yok — makine ağırlıkları + yüzme + sauna. Her antrenman sonrası 15-20 dk hafif yüzme ve sauna ile kapat.</p>
          <ul class="plan-list" id="planList"></ul>
        </div>
      </section>

      <section class="tab-panel hidden" id="panel-log">
        <div class="card">
          <h2>Bugünkü Antrenman</h2>
          <form id="workoutForm">
            <div id="exerciseRows"></div>
            <button type="button" class="btn-secondary" id="addExerciseBtn">+ Egzersiz ekle</button>

            <div class="field-row">
              <label>
                Yüzme (dk)
                <input type="number" id="swimMin" min="0" placeholder="15" />
              </label>
              <label>
                Sauna (dk)
                <input type="number" id="saunaMin" min="0" placeholder="10" />
              </label>
            </div>

            <label class="full">
              Not
              <input type="text" id="workoutNote" placeholder="opsiyonel" />
            </label>

            <button type="submit" class="btn-primary">Antrenmanı Kaydet</button>
          </form>
        </div>

        <div class="card">
          <h2>Geçmiş</h2>
          <div id="workoutHistory" class="history-list"></div>
        </div>
      </section>

      <section class="tab-panel hidden" id="panel-weight">
        <div class="card">
          <h2>Kilo Ekle</h2>
          <form id="weightForm">
            <label class="full">
              Kilo (kg)
              <input type="number" step="0.1" id="weightInput" placeholder="84.5" required />
            </label>
            <button type="submit" class="btn-primary">Kaydet</button>
          </form>
        </div>
        <div class="card">
          <h2>Kilo Geçmişi</h2>
          <div id="weightChart" class="weight-chart"></div>
          <div id="weightHistory" class="history-list"></div>
        </div>
      </section>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
